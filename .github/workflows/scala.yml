name: Scala CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'

    # sbt コマンドが未導入の場合の対策
    - name: Install sbt
      uses: coursier/setup-action@v1
      with:
        apps: sbt

    - name: Run tests
      working-directory: Lab00
      run: sbt test
